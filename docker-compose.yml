services:
  postgres:
    image: postgres:16-alpine
    container_name: assetchain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: assetchain_admin
      POSTGRES_PASSWORD: assetchain_secure_password_example
      POSTGRES_DB: assetchain_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetchain_admin -d assetchain_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web-based database management UI (accessible at http://localhost:8081)
  adminer:
    image: adminer:latest
    container_name: assetchain-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
